# --------------------------------------------------------------------------
# KONE ELEVATE - full prototype stack
#
#   docker compose up --build
#
#   frontend  http://localhost:5173   (nginx, proxies /api to the backend)
#   backend   http://localhost:8000   (FastAPI, Swagger at /docs)
#   postgres  localhost:55432  (not 5432 - see the ports comment below)
#   pgadmin   http://localhost:5050   (optional: --profile tools)
#
# Copy .env.example to .env before starting to override any credential.
# --------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: kone-elevate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kone_elevate}
      POSTGRES_USER: ${POSTGRES_USER:-kone_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    # WAL archiving for point-in-time recovery (P4) - see
    # docs/disaster-recovery.md for the retention policy and a real,
    # timestamped restore drill run against this exact configuration.
    # archive_command is a shell one-liner run BY Postgres, not this compose
    # file, so it only ever sees the two placeholders (%p source, %f
    # filename) Postgres substitutes - no external input reaches it.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
      -c max_wal_senders=3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
    ports:
      # Deliberately NOT 5432 by default. The backend and pgAdmin both reach
      # Postgres over the compose network, so publishing it to the host is a
      # developer convenience only - and defaulting to 5432 made the
      # documented one-command demo fail with a bare "address already in
      # use" on any machine that already runs Postgres, which is most
      # developer laptops. Set POSTGRES_PORT=5432 if you want the usual one.
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kone_admin} -d ${POSTGRES_DB:-kone_elevate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - kone-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kone-elevate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kone_admin}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-kone_elevate}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:4173}
      QR_BASE_URL: ${QR_BASE_URL:-http://localhost:5173}
      MODEL_PATH: models/random_forest.joblib
      MODEL_VERSION: ${MODEL_VERSION:-RF-v1.0-synthetic}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      # DEBUG defaults true so the one-command demo keeps working with the
      # placeholder SECRET_KEY above. Any real deployment MUST set DEBUG=false
      # and a real SECRET_KEY in .env - the backend refuses to start otherwise
      # (see app.main._guard_against_default_secret).
      DEBUG: ${DEBUG:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Keep the trained model and generated dataset across rebuilds.
      - model_data:/app/models
      - dataset_data:/app/data
    # Wait for PostgreSQL, apply migrations, seed on first run, then serve.
    command: >
      sh -c "
      alembic upgrade head &&
      python scripts/seed_database.py --quiet || true &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - kone-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kone-elevate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - kone-net

  # Optional database inspector: docker compose --profile tools up
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kone-elevate-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kone-elevate.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - kone-net

volumes:
  postgres_data:
  postgres_wal_archive:
  pgadmin_data:
  model_data:
  dataset_data:

networks:
  kone-net:
    driver: bridge
