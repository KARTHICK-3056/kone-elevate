# KONE ELEVATE - backend locked dependencies
#
# Exact, reproducible resolution of requirements.txt, generated with:
#   pip install -r requirements.txt
#   pip freeze > requirements.lock
#
# This is the file Docker builds and CI install from. requirements.txt stays
# the human-edited source of direct dependencies with acceptable ranges;
# requirements.lock is what actually ships, so a rebuilt image can never load
# a joblib model bundle pickled by a different scikit-learn/joblib minor
# version than the one that trained it (see app.ml.model_registry's version
# assertion, which fails loudly if this ever drifts).
#
# Regenerate after any change to requirements.txt:
#   pip install -r requirements.txt && pip freeze > requirements.lock
#
# then restore the two platform markers pip freeze drops: uvloop is
# Linux/macOS-only (uvicorn[standard] skips it on Windows) and colorama is
# Windows-only. Without them this file cannot install on Windows.
#
# Trained/tested with Python 3.12.0 (see Dockerfile).

